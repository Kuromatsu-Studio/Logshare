<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up | Logshare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav>
    <a href="/" class="nav-brand">Logshare</a>
  </nav>

  <main class="container" style="max-width:400px;margin-top:4rem;">
    <h1 style="font-family:var(--font-mono);margin-bottom:1.5rem;">Sign Up</h1>
    <form id="signup-form" class="card">
      <div class="card" style="margin-bottom:1rem;">
      <button type="button" onclick="signInWith('github')" class="btn" style="width:100%;">
        Sign in with GitHub
      </button>
      </div>
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem;">Sign up</button>
      <p style="margin-top:1rem;text-align:center;font-size:0.85rem;">Have an account? <a href="/sign-in.html">Sign in</a></p>
    </form>
  </main>

  <footer>
    <div>
        Logshare &copy; 2026 Kuromatsu Studio
      <span style="margin-left: 1rem;">
        <a href="mailto:kuromatsustudio@gmail.com">Contact</a>
        <a href="https://github.com/BananaChristian/logshare" target="_blank" style="margin-left: 0.5rem;">GitHub</a>
      </span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>    
  <script>
    async function signInWith(provider) {
      var sb = await waitForSupabase();
      var { error } = await sb.auth.signInWithOAuth({
        provider: provider,
        options: {
          redirectTo: 'http://localhost:3000'
        }
      });
      if (error) alert(error.message);
    }

    document.getElementById('signup-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      var sb = await waitForSupabase();
      var { error } = await sb.auth.signUp({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      });
      if (error) {
        alert(error.message);
      } else {
        alert('Account created! You can now sign in.');
        window.location.href = '/sign-in.html';
      }
    });
  </script>
  <script>lucide.createIcons();</script>
  </body>
</html>
