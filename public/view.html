<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Log | Logshare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav>
    <a href="/" class="nav-brand">Logshare</a>
    <span class="nav-links" id="nav-auth"></span>
  </nav>

    <main class="container">
    <div class="viewer-header">
      <div>
        <div class="viewer-title" id="title">Loading...</div>
        <div class="viewer-meta" id="meta"></div>
        <div class="viewer-meta" id="format-badge"></div>
      </div>
      <div class="viewer-meta" id="expires" style="color: var(--alert);"></div>
    </div>

    <div class="toolbar">
      <button onclick="setFilter('ALL')" id="f-ALL" class="active">ALL</button>
      <button onclick="setFilter('ERROR')" id="f-ERROR">ERROR</button>
      <button onclick="setFilter('WARN')" id="f-WARN">WARN</button>
      <button onclick="setFilter('INFO')" id="f-INFO">INFO</button>
      <button onclick="setFilter('DEBUG')" id="f-DEBUG">DEBUG</button>
      <button onclick="setFilter('FATAL')" id="f-FATAL">FATAL</button>
      <input type="text" id="search" placeholder="Search..." oninput="render()">
      <span style="flex:1;"></span>
      <button onclick="copyLink()">Copy link</button>
      <button onclick="copyText()">Copy text</button>
      <a id="raw-link" target="_blank">Raw</a>
    </div>

    <div class="log-lines" id="lines"></div>
    <p id="empty" class="meta hidden" style="text-align:center;padding:2rem;">No lines match.</p>
  </main>

    <footer>
    <div>
        Logshare &copy; 2026 Kuromatsu Studio
      <span style="margin-left: 1rem;">
        <a href="mailto:kuromatsustudio@gmail.com">Contact</a>
        <a href="https://github.com/BananaChristian/logshare" target="_blank" style="margin-left: 0.5rem;">GitHub</a>
      </span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/viewer.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
